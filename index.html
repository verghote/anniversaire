<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2c3e50" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Anniversaires" />
  <title>Gestionnaire d'Anniversaires</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2c3e50;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --row-alt: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .app-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      color: var(--primary);
    }

    .status-badge {
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      margin-bottom: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)) auto auto;
      gap: 10px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
    }

    .field input {
      height: 40px;
      padding: 0 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
    }

    .field input:focus {
      outline: 2px solid var(--accent);
      border-color: var(--accent);
    }

    button {
      height: 40px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-add {
      background: var(--success-soft);
      color: #14532d;
      border-color: #86efac;
    }

    .btn-clear {
      background: #f1f5f9;
      color: var(--text);
      border-color: #cbd5e1;
    }

    .btn-sort {
      background: #e2e8f0;
      color: var(--primary);
    }

    .btn-pdf {
      background: var(--accent-soft);
      color: #1e3a8a;
      border-color: #93c5fd;
    }

    .btn-io {
      background: #fff;
      color: var(--primary);
      border-color: #cbd5e1;
    }

    button:hover {
      filter: brightness(0.97);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      height: 38px;
      padding: 0 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      min-width: 210px;
      background: #fff;
    }

    .info-text {
      font-size: 0.88rem;
      font-style: italic;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
      font-size: 0.92rem;
    }

    thead th {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      padding: 10px 10px;
      text-align: left;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    thead th.sortable {
      cursor: pointer;
    }

    thead th.sortable:hover {
      background: #3b526b;
    }

    thead th.col-del,
    tbody td.col-del {
      width: 44px;
      min-width: 44px;
      max-width: 44px;
      text-align: center;
      padding: 6px;
    }

    thead th.center,
    tbody td.center {
      text-align: center;
    }

    tbody tr:nth-child(even) {
      background: var(--row-alt);
    }

    tbody tr:hover {
      background: #eef2ff;
    }

    tbody td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 1rem;
      height: 30px;
      width: 30px;
      padding: 0;
    }

    .inline-input {
      width: 100%;
      height: 30px;
      padding: 0 6px;
      font-size: 0.9rem;
      border: 2px solid var(--accent);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .app-container {
        padding: 10px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .search-input {
        width: 100%;
        min-width: 0;
      }
    }

    /* Repli impression si jsPDF n'est pas chargé hors ligne */
    .print-only {
      display: none;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 16mm 12mm 16mm 12mm;
      }

      body {
        background: #fff;
        padding: 0;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      .print-doc-title {
        text-align: center;
        font-size: 18pt;
        color: #2c3e50;
        margin: 0 0 14pt 0;
      }

      .month-group {
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 16pt;
      }

      .month-heading {
        font-size: 12pt;
        font-weight: 700;
        color: #34495e;
        margin: 0 0 5pt 0;
        text-transform: uppercase;
      }

      .print-table {
        width: 100%;
        min-width: 0;
        border-collapse: collapse;
        font-size: 9.5pt;
      }

      .print-table thead {
        display: table-header-group;
      }

      .print-table th {
        background: #34495e !important;
        color: #fff !important;
        padding: 6pt 7pt;
        border: 0.5pt solid #dddddd;
        position: static;
      }

      .print-table td {
        padding: 5pt 7pt;
        border: 0.5pt solid #dddddd;
        background: #fff !important;
      }

      .print-table tbody tr:nth-child(even) td {
        background: #f9f9f9 !important;
      }
    }
  </style>
</head>
<body>
<div class="app-container no-print">
  <header>
    <h1>🎂 Gestionnaire d'Anniversaires</h1>
    <span id="statusBadge" class="status-badge">Chargement...</span>
  </header>

  <section class="card" aria-label="Gestion d'un anniversaire">
    <div class="form-grid">
      <div class="field">
        <label for="dateInput">Date de naissance</label>
        <input type="date" id="dateInput" />
      </div>

      <div class="field">
        <label for="nameInput">Nom &amp; Prénom</label>
        <input type="text" id="nameInput" placeholder="Ex. Camille Dupont" autocomplete="off" />
      </div>

      <button type="button" id="addBtn" class="btn-add">Ajouter</button>
      <button type="button" id="clearBtn" class="btn-clear">Vider</button>
    </div>
  </section>

  <div class="toolbar">
    <div class="toolbar-group">
      <button type="button" id="upcomingBtn" class="btn-sort">📌 Trier par Prochains Anniversaires</button>
      <input type="search" id="searchInput" class="search-input" placeholder="Rechercher un nom..." />
    </div>

    <div class="toolbar-group">
      <button type="button" id="importJsonBtn" class="btn-io">📥 Importer JSON</button>
      <button type="button" id="exportJsonBtn" class="btn-io">📤 Exporter JSON</button>
      <button type="button" id="pdfBtn" class="btn-pdf">Générer le PDF</button>
      <input type="file" id="jsonFileInput" accept=".json,application/json" hidden />
    </div>
  </div>

  <div class="info-text">
    Double-cliquez sur une Date ou un Nom dans le tableau pour modifier directement.
  </div>

  <div class="table-wrapper">
    <table id="birthdayTable">
      <thead>
      <tr>
        <th class="col-del" title="Supprimer">❌</th>
        <th class="sortable center" data-col="date">Date de naissance ↕</th>
        <th class="sortable" data-col="nom">Nom &amp; Prénom ↕</th>
        <th class="sortable" data-col="age">Âge ↕</th>
        <th class="sortable center" data-col="prochain">Prochain Ann. ↕</th>
        <th class="sortable center" data-col="joursVecus">Jours vécus ↕</th>
        <th class="sortable" data-col="jourNais">Jour de naissance ↕</th>
      </tr>
      </thead>
      <tbody id="birthdayBody"></tbody>
    </table>
  </div>
</div>

<div id="printContainer" class="print-only"></div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="./index.js"></script>
</body>
</html>
